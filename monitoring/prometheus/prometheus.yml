# ============================================================================
# MAHOUN Prometheus Configuration - Enterprise Monitoring
# ============================================================================
# Purpose: Comprehensive metrics collection from all platform services
# Features: Service discovery, alerting rules, recording rules
# ============================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  
  external_labels:
    cluster: 'mahoun-production'
    environment: 'production'
    datacenter: 'primary'
    team: 'platform'

# =============================================================================
# ALERTING CONFIGURATION
# =============================================================================
alerting:
  alert_relabel_configs:
    - source_labels: [dc]
      target_label: dc
      replacement: 'primary'
  
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 10s
      api_version: v2

# =============================================================================
# RULE FILES
# =============================================================================
rule_files:
  - '/etc/prometheus/alerts/*.yml'
  - '/etc/prometheus/recording-rules/*.yml'

# =============================================================================
# SCRAPE CONFIGURATIONS
# =============================================================================
scrape_configs:
  # ---------------------------------------------------------------------------
  # PROMETHEUS SELF-MONITORING
  # ---------------------------------------------------------------------------
  - job_name: 'prometheus'
    honor_labels: true
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          tier: 'monitoring'
    
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'prometheus_tsdb_.*'
        action: keep
      - source_labels: [__name__]
        regex: 'prometheus_rule_.*'
        action: keep

  # ---------------------------------------------------------------------------
  # MAHOUN CORE SERVICES
  # ---------------------------------------------------------------------------
  - job_name: 'governance-kernel'
    honor_labels: true
    static_configs:
      - targets: ['governance-kernel:8080']
        labels:
          service: 'governance-kernel'
          tier: 'core'
          component: 'governance'
    
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 8s

  - job_name: 'api-server'
    honor_labels: true
    static_configs:
      - targets: ['api-server:8000']
        labels:
          service: 'api-server'
          tier: 'api'
          component: 'backend'
    
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'mcp-server'
    honor_labels: true
    static_configs:
      - targets: ['mcp-server:8000']
        labels:
          service: 'mcp-server'
          tier: 'api'
          component: 'mcp'
    
    metrics_path: '/metrics'
    scrape_interval: 15s

  # ---------------------------------------------------------------------------
  # NEO4J GRAPH DATABASE
  # ---------------------------------------------------------------------------
  - job_name: 'neo4j'
    honor_labels: true
    static_configs:
      - targets: ['neo4j:2004']
        labels:
          service: 'neo4j'
          tier: 'database'
          db_type: 'graph'
    
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 15s
    
    # Neo4j-specific metric filtering
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'neo4j_(database|pool|store|transaction|cypher)_.*'
        action: keep
      - source_labels: [__name__]
        regex: 'neo4j_bolt_.*'
        action: keep

  # ---------------------------------------------------------------------------
  # POSTGRESQL RELATIONAL DATABASE
  # ---------------------------------------------------------------------------
  - job_name: 'postgresql'
    honor_labels: true
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgresql'
          tier: 'database'
          db_type: 'relational'
    
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # ---------------------------------------------------------------------------
  # REDIS CACHE
  # ---------------------------------------------------------------------------
  - job_name: 'redis'
    honor_labels: true
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          tier: 'cache'
          db_type: 'key-value'
    
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 8s

  # ---------------------------------------------------------------------------
  # CHROMADB VECTOR DATABASE
  # ---------------------------------------------------------------------------
  - job_name: 'chromadb'
    honor_labels: true
    static_configs:
      - targets: ['chromadb:8000']
        labels:
          service: 'chromadb'
          tier: 'database'
          db_type: 'vector'
    
    metrics_path: '/api/v1/metrics'
    scrape_interval: 30s

  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE MONITORING
  # ---------------------------------------------------------------------------
  - job_name: 'node-exporter'
    honor_labels: true
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          tier: 'infrastructure'
          component: 'host'
    
    metrics_path: '/metrics'
    scrape_interval: 30s
    
    # Node exporter metric filtering
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'node_(cpu|memory|disk|network|filesystem)_.*'
        action: keep

  - job_name: 'cadvisor'
    honor_labels: true
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
          tier: 'infrastructure'
          component: 'containers'
    
    metrics_path: '/metrics'
    scrape_interval: 30s
    
    # Container metrics filtering
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'container_(cpu|memory|network|fs)_.*'
        action: keep

  # ---------------------------------------------------------------------------
  # MONITORING INFRASTRUCTURE
  # ---------------------------------------------------------------------------
  - job_name: 'alertmanager'
    honor_labels: true
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: 'alertmanager'
          tier: 'monitoring'
    
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'loki'
    honor_labels: true
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: 'loki'
          tier: 'monitoring'
    
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'tempo'
    honor_labels: true
    static_configs:
      - targets: ['tempo:3200']
        labels:
          service: 'tempo'
          tier: 'monitoring'
    
    metrics_path: '/metrics'
    scrape_interval: 30s

