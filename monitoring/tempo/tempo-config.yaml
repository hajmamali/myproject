# ============================================================================
# MAHOUN Tempo Configuration - Distributed Tracing
# ============================================================================
# Purpose: Collect and store distributed traces from all services
# Features: Multi-protocol support, high-cardinality indexing
# ============================================================================

server:
  http_listen_port: 3200
  grpc_listen_port: 9096
  log_level: info
  log_format: json

# =============================================================================
# DISTRIBUTOR CONFIGURATION
# =============================================================================
distributor:
  receivers:
    # OpenTelemetry Protocol (OTLP)
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    
    # Jaeger Protocol
    jaeger:
      protocols:
        grpc:
          endpoint: 0.0.0.0:14250
        thrift_http:
          endpoint: 0.0.0.0:14268
        thrift_compact:
          endpoint: 0.0.0.0:6831
        thrift_binary:
          endpoint: 0.0.0.0:6832
    
    # Zipkin Protocol
    zipkin:
      endpoint: 0.0.0.0:9411
  
  # Rate limiting
  rate_limit:
    enabled: true
    ingestion_rate_limit: 100000
    ingestion_burst_size: 200000

# =============================================================================
# INGESTER CONFIGURATION
# =============================================================================
ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    
    # Trace retention in ingester before flushing
    tokens_file_path: /tempo/tokens.json
    final_sleep: 0s
  
  # Trace idle time before flushing
  trace_idle_period: 10s
  
  # Max block time before flushing
  max_block_duration: 30m
  
  # Max block size before flushing
  max_block_bytes: 1073741824  # 1GB
  
  # Flush check period
  flush_check_period: 10s
  
  # Flush on shutdown
  flush_op_timeout: 10s

# =============================================================================
# COMPACTOR CONFIGURATION
# =============================================================================
compactor:
  compaction:
    block_retention: 720h  # 30 days
    compacted_block_retention: 1h
    compaction_window: 1h
    max_compaction_objects: 1000000
    max_block_bytes: 107374182400  # 100GB
    max_time_per_tenant: 5m
    retention_concurrency: 10
  
  ring:
    kvstore:
      store: inmemory

# =============================================================================
# STORAGE CONFIGURATION
# =============================================================================
storage:
  trace:
    backend: local
    
    local:
      path: /tempo/blocks
    
    # Block configuration
    block:
      version: vParquet3
      encoding: zstd
      
      # Index configuration (Parquet columnar format)
      parquet:
        row_group_size_bytes: 134217728  # 128MB
        
        # Enable dedicated attribute columns for high-cardinality indexing
        dedicated_columns:
          - name: http.method
            type: string
          - name: http.status_code
            type: int
          - name: http.url
            type: string
          - name: service.name
            type: string
          - name: service.namespace
            type: string
          - name: db.system
            type: string
          - name: db.name
            type: string
          - name: messaging.system
            type: string
          - name: error
            type: bool
    
    # Write-Ahead Log
    wal:
      path: /tempo/wal
      encoding: snappy
    
    # Cache configuration
    cache: none
    
    # Background cache
    background_cache:
      writeback_goroutines: 10
      writeback_buffer: 10000
  
  # Pool configuration for better memory management
  pool:
    max_workers: 100
    queue_depth: 10000

# =============================================================================
# QUERY FRONTEND CONFIGURATION
# =============================================================================
query_frontend:
  # Enable query sharding
  search:
    concurrent_jobs: 1000
    target_bytes_per_job: 104857600  # 100MB
    max_duration: 0s  # No limit
  
  # Trace by ID query configuration
  trace_by_id:
    query_shards: 50
  
  # Maximum query lookback
  max_retries: 2

# =============================================================================
# QUERIER CONFIGURATION
# =============================================================================
querier:
  # Frontend worker configuration
  frontend_worker:
    frontend_address: localhost:9095
    grpc_client_config:
      max_send_msg_size: 16777216  # 16MB
  
  # Max concurrent queries per tenant
  max_concurrent_queries: 20
  
  # Search configuration
  search:
    external_endpoints: []
    query_timeout: 30s
    prefer_self: 10

# =============================================================================
# METRICS GENERATOR (Exemplars & Service Graphs)
# =============================================================================
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: mahoun-production
  
  storage:
    path: /tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
        headers:
          X-Scope-OrgID: mahoun
  
  # Trace filtering for metrics
  processor:
    service_graphs:
      # Generate service dependency graph
      dimensions:
        - http.method
        - http.status_code
        - service.namespace
      
      histogram_buckets: [0.1, 0.2, 0.4, 0.8, 1.6, 3.2, 6.4, 12.8]
      
      # Peer attributes for service graph edges
      peer_attributes:
        - peer.service
        - db.name
        - messaging.system
    
    span_metrics:
      # Generate RED metrics (Rate, Errors, Duration)
      dimensions:
        - http.method
        - http.status_code
        - service.name
        - error
      
      histogram_buckets: [0.002, 0.004, 0.008, 0.016, 0.032, 0.064, 0.128, 0.256, 0.512, 1.024, 2.048, 4.096, 8.192, 16.384]
      
      # Enable exemplars
      enable_target_info: true
      
      # Intrinsic dimensions (always included)
      intrinsic_dimensions:
        service: true
        span_name: true
        span_kind: true
        status_code: true

# =============================================================================
# OVERRIDES CONFIGURATION (Per-tenant limits)
# =============================================================================
overrides:
  defaults:
    # Ingestion limits
    ingestion_rate_limit: 100000
    ingestion_burst_size: 200000
    max_bytes_per_trace: 50000000  # 50MB
    max_spans_per_trace: 100000
    
    # Search limits
    max_search_bytes_per_trace: 0  # No limit
    
    # Metrics generator
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
      
      # Collection interval
      collection_interval: 15s
      
      # Disable for specific tenants if needed
      disable_collection: false
    
    # Forwarders (for distributed setups)
    forwarders: []

# =============================================================================
# USAGE REPORT (Telemetry - Disabled)
# =============================================================================
usage_report:
  reporting_enabled: false

# =============================================================================
# MEMBERLIST (Clustering - Single instance setup)
# =============================================================================
memberlist:
  abort_if_cluster_join_fails: false
  bind_port: 7946
  join_members: []

# =============================================================================
# LIMITS CONFIGURATION
# =============================================================================
limits:
  # Ingestion limits
  max_bytes_per_tag_values_query: 5000000  # 5MB
  
  # Block retention
  max_blocks_per_tenant: 0  # No limit
