# ============================================================================
# PostgreSQL Exporter - Custom Queries for MAHOUN
# ============================================================================
# Purpose: Advanced PostgreSQL metrics collection
# ============================================================================

# =============================================================================
# DATABASE SIZE METRICS
# =============================================================================
pg_database:
  query: |
    SELECT 
      datname as database,
      pg_database_size(datname) as size_bytes,
      numbackends as active_connections,
      xact_commit as commits,
      xact_rollback as rollbacks,
      blks_read as blocks_read,
      blks_hit as blocks_hit,
      tup_returned as tuples_returned,
      tup_fetched as tuples_fetched,
      tup_inserted as tuples_inserted,
      tup_updated as tuples_updated,
      tup_deleted as tuples_deleted,
      conflicts as conflicts,
      deadlocks as deadlocks
    FROM pg_stat_database
    WHERE datname NOT IN ('template0', 'template1', 'postgres')
  metrics:
    - database:
        usage: "LABEL"
        description: "Database name"
    - size_bytes:
        usage: "GAUGE"
        description: "Database size in bytes"
    - active_connections:
        usage: "GAUGE"
        description: "Number of active connections"
    - commits:
        usage: "COUNTER"
        description: "Number of committed transactions"
    - rollbacks:
        usage: "COUNTER"
        description: "Number of rolled back transactions"
    - blocks_read:
        usage: "COUNTER"
        description: "Number of disk blocks read"
    - blocks_hit:
        usage: "COUNTER"
        description: "Number of buffer hits"
    - tuples_returned:
        usage: "COUNTER"
        description: "Number of tuples returned"
    - tuples_fetched:
        usage: "COUNTER"
        description: "Number of tuples fetched"
    - tuples_inserted:
        usage: "COUNTER"
        description: "Number of tuples inserted"
    - tuples_updated:
        usage: "COUNTER"
        description: "Number of tuples updated"
    - tuples_deleted:
        usage: "COUNTER"
        description: "Number of tuples deleted"
    - conflicts:
        usage: "COUNTER"
        description: "Number of queries canceled due to conflicts"
    - deadlocks:
        usage: "COUNTER"
        description: "Number of deadlocks detected"

# =============================================================================
# TABLE SIZE METRICS
# =============================================================================
pg_table_size:
  query: |
    SELECT 
      schemaname as schema,
      tablename as table,
      pg_total_relation_size(schemaname||'.'||tablename) as total_bytes,
      pg_relation_size(schemaname||'.'||tablename) as table_bytes,
      pg_indexes_size(schemaname||'.'||tablename) as indexes_bytes
    FROM pg_tables
    WHERE schemaname NOT IN ('pg_catalog', 'information_schema')
    ORDER BY pg_total_relation_size(schemaname||'.'||tablename) DESC
    LIMIT 50
  metrics:
    - schema:
        usage: "LABEL"
        description: "Schema name"
    - table:
        usage: "LABEL"
        description: "Table name"
    - total_bytes:
        usage: "GAUGE"
        description: "Total size including indexes"
    - table_bytes:
        usage: "GAUGE"
        description: "Table size in bytes"
    - indexes_bytes:
        usage: "GAUGE"
        description: "Indexes size in bytes"

# =============================================================================
# TABLE STATISTICS
# =============================================================================
pg_table_stats:
  query: |
    SELECT 
      schemaname as schema,
      relname as table,
      seq_scan as sequential_scans,
      seq_tup_read as sequential_tuples_read,
      idx_scan as index_scans,
      idx_tup_fetch as index_tuples_fetched,
      n_tup_ins as tuples_inserted,
      n_tup_upd as tuples_updated,
      n_tup_del as tuples_deleted,
      n_tup_hot_upd as hot_updates,
      n_live_tup as live_tuples,
      n_dead_tup as dead_tuples,
      n_mod_since_analyze as modifications_since_analyze,
      last_vacuum as last_vacuum_time,
      last_autovacuum as last_autovacuum_time,
      last_analyze as last_analyze_time,
      last_autoanalyze as last_autoanalyze_time,
      vacuum_count,
      autovacuum_count,
      analyze_count,
      autoanalyze_count
    FROM pg_stat_user_tables
    ORDER BY n_live_tup DESC
    LIMIT 50
  metrics:
    - schema:
        usage: "LABEL"
        description: "Schema name"
    - table:
        usage: "LABEL"
        description: "Table name"
    - sequential_scans:
        usage: "COUNTER"
        description: "Number of sequential scans"
    - sequential_tuples_read:
        usage: "COUNTER"
        description: "Number of tuples read by sequential scans"
    - index_scans:
        usage: "COUNTER"
        description: "Number of index scans"
    - index_tuples_fetched:
        usage: "COUNTER"
        description: "Number of tuples fetched by index scans"
    - tuples_inserted:
        usage: "COUNTER"
        description: "Number of tuples inserted"
    - tuples_updated:
        usage: "COUNTER"
        description: "Number of tuples updated"
    - tuples_deleted:
        usage: "COUNTER"
        description: "Number of tuples deleted"
    - hot_updates:
        usage: "COUNTER"
        description: "Number of HOT updates"
    - live_tuples:
        usage: "GAUGE"
        description: "Estimated number of live tuples"
    - dead_tuples:
        usage: "GAUGE"
        description: "Estimated number of dead tuples"
    - modifications_since_analyze:
        usage: "GAUGE"
        description: "Number of modifications since last analyze"
    - vacuum_count:
        usage: "COUNTER"
        description: "Number of times vacuumed"
    - autovacuum_count:
        usage: "COUNTER"
        description: "Number of times auto-vacuumed"
    - analyze_count:
        usage: "COUNTER"
        description: "Number of times analyzed"
    - autoanalyze_count:
        usage: "COUNTER"
        description: "Number of times auto-analyzed"

# =============================================================================
# INDEX USAGE
# =============================================================================
pg_index_usage:
  query: |
    SELECT 
      schemaname as schema,
      tablename as table,
      indexname as index,
      idx_scan as scans,
      idx_tup_read as tuples_read,
      idx_tup_fetch as tuples_fetched,
      pg_relation_size(indexrelid) as size_bytes
    FROM pg_stat_user_indexes
    ORDER BY idx_scan DESC
    LIMIT 50
  metrics:
    - schema:
        usage: "LABEL"
        description: "Schema name"
    - table:
        usage: "LABEL"
        description: "Table name"
    - index:
        usage: "LABEL"
        description: "Index name"
    - scans:
        usage: "COUNTER"
        description: "Number of index scans"
    - tuples_read:
        usage: "COUNTER"
        description: "Number of index entries returned"
    - tuples_fetched:
        usage: "COUNTER"
        description: "Number of live table rows fetched"
    - size_bytes:
        usage: "GAUGE"
        description: "Index size in bytes"

# =============================================================================
# SLOW QUERIES (requires pg_stat_statements)
# =============================================================================
pg_slow_queries:
  query: |
    SELECT 
      queryid,
      LEFT(query, 100) as query_text,
      calls,
      total_exec_time as total_time_ms,
      mean_exec_time as mean_time_ms,
      max_exec_time as max_time_ms,
      stddev_exec_time as stddev_time_ms,
      rows,
      shared_blks_hit,
      shared_blks_read,
      shared_blks_written,
      temp_blks_read,
      temp_blks_written
    FROM pg_stat_statements
    WHERE mean_exec_time > 100
    ORDER BY mean_exec_time DESC
    LIMIT 20
  metrics:
    - queryid:
        usage: "LABEL"
        description: "Query ID"
    - query_text:
        usage: "LABEL"
        description: "Query text (truncated)"
    - calls:
        usage: "COUNTER"
        description: "Number of times executed"
    - total_time_ms:
        usage: "COUNTER"
        description: "Total execution time in milliseconds"
    - mean_time_ms:
        usage: "GAUGE"
        description: "Mean execution time in milliseconds"
    - max_time_ms:
        usage: "GAUGE"
        description: "Maximum execution time in milliseconds"
    - stddev_time_ms:
        usage: "GAUGE"
        description: "Standard deviation of execution time"
    - rows:
        usage: "COUNTER"
        description: "Total number of rows retrieved or affected"
    - shared_blks_hit:
        usage: "COUNTER"
        description: "Shared blocks hit"
    - shared_blks_read:
        usage: "COUNTER"
        description: "Shared blocks read"
    - shared_blks_written:
        usage: "COUNTER"
        description: "Shared blocks written"
    - temp_blks_read:
        usage: "COUNTER"
        description: "Temp blocks read"
    - temp_blks_written:
        usage: "COUNTER"
        description: "Temp blocks written"

# =============================================================================
# REPLICATION METRICS
# =============================================================================
pg_replication:
  query: |
    SELECT 
      client_addr as replica_address,
      state,
      sync_state,
      COALESCE(pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn), 0) as lag_bytes,
      COALESCE(EXTRACT(EPOCH FROM (now() - replay_timestamp)), 0) as lag_seconds
    FROM pg_stat_replication
  metrics:
    - replica_address:
        usage: "LABEL"
        description: "Replica address"
    - state:
        usage: "LABEL"
        description: "Replication state"
    - sync_state:
        usage: "LABEL"
        description: "Synchronization state"
    - lag_bytes:
        usage: "GAUGE"
        description: "Replication lag in bytes"
    - lag_seconds:
        usage: "GAUGE"
        description: "Replication lag in seconds"

# =============================================================================
# CONNECTION POOL METRICS
# =============================================================================
pg_connections:
  query: |
    SELECT 
      datname as database,
      state,
      COUNT(*) as connections
    FROM pg_stat_activity
    WHERE datname IS NOT NULL
    GROUP BY datname, state
  metrics:
    - database:
        usage: "LABEL"
        description: "Database name"
    - state:
        usage: "LABEL"
        description: "Connection state"
    - connections:
        usage: "GAUGE"
        description: "Number of connections"

# =============================================================================
# LOCK METRICS
# =============================================================================
pg_locks:
  query: |
    SELECT 
      mode,
      locktype,
      COUNT(*) as locks
    FROM pg_locks
    GROUP BY mode, locktype
  metrics:
    - mode:
        usage: "LABEL"
        description: "Lock mode"
    - locktype:
        usage: "LABEL"
        description: "Lock type"
    - locks:
        usage: "GAUGE"
        description: "Number of locks"

# =============================================================================
# BLOAT ESTIMATION
# =============================================================================
pg_table_bloat:
  query: |
    SELECT 
      schemaname as schema,
      tablename as table,
      ROUND(CASE WHEN otta=0 OR sml.relpages=0 THEN 0.0 
        ELSE sml.relpages/otta::numeric END, 1) AS bloat_ratio,
      CASE WHEN relpages < otta THEN 0 
        ELSE (bs*(sml.relpages-otta)::bigint)::bigint 
      END AS bloat_bytes
    FROM (
      SELECT
        schemaname, tablename, cc.reltuples, cc.relpages, bs,
        CEIL((cc.reltuples*((datahdr+ma-
          (CASE WHEN datahdr%ma=0 THEN ma ELSE datahdr%ma END))+nullhdr2+4))/(bs-20::float)) AS otta
      FROM (
        SELECT
          ma,bs,schemaname,tablename,
          (datawidth+(hdr+ma-(case when hdr%ma=0 THEN ma ELSE hdr%ma END)))::numeric AS datahdr,
          (maxfracsum*(nullhdr+ma-(case when nullhdr%ma=0 THEN ma ELSE nullhdr%ma END))) AS nullhdr2
        FROM (
          SELECT
            schemaname, tablename, hdr, ma, bs,
            SUM((1-null_frac)*avg_width) AS datawidth,
            MAX(null_frac) AS maxfracsum,
            hdr+(
              SELECT 1+count(*)/8
              FROM pg_stats s2
              WHERE null_frac<>0 AND s2.schemaname = s.schemaname AND s2.tablename = s.tablename
            ) AS nullhdr
          FROM pg_stats s, (
            SELECT
              (SELECT current_setting('block_size')::numeric) AS bs,
              CASE WHEN substring(v,12,3) IN ('8.0','8.1','8.2') THEN 27 ELSE 23 END AS hdr,
              CASE WHEN v ~ 'mingw32' THEN 8 ELSE 4 END AS ma
            FROM (SELECT version() AS v) AS foo
          ) AS constants
          GROUP BY 1,2,3,4,5
        ) AS foo
      ) AS rs
      JOIN pg_class cc ON cc.relname = rs.tablename
      JOIN pg_namespace nn ON cc.relnamespace = nn.oid AND nn.nspname = rs.schemaname AND nn.nspname <> 'information_schema'
    ) AS sml
    WHERE sml.relpages - otta > 10
    ORDER BY bloat_bytes DESC
    LIMIT 20
  metrics:
    - schema:
        usage: "LABEL"
        description: "Schema name"
    - table:
        usage: "LABEL"
        description: "Table name"
    - bloat_ratio:
        usage: "GAUGE"
        description: "Estimated bloat ratio"
    - bloat_bytes:
        usage: "GAUGE"
        description: "Estimated bloat in bytes"
