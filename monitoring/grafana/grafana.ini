# ============================================================================
# MAHOUN Grafana Configuration - Enterprise Settings
# ============================================================================
# Purpose: Production-grade Grafana configuration
# Security: Hardened for production deployment
# ============================================================================

##################### Grafana Configuration ####################

# =============================================================================
# PATHS
# =============================================================================
[paths]
data = /var/lib/grafana
temp_data_lifetime = 24h
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

# =============================================================================
# SERVER
# =============================================================================
[server]
protocol = http
http_addr = 0.0.0.0
http_port = 3000
domain = localhost
enforce_domain = false
root_url = %(protocol)s://%(domain)s:%(http_port)s/
serve_from_sub_path = false
router_logging = false
static_root_path = public
enable_gzip = true
cert_file =
cert_key =
socket =
cdn_url =
read_timeout = 0

# =============================================================================
# DATABASE (SQLite with WAL mode)
# =============================================================================
[database]
type = sqlite3
host = 127.0.0.1:3306
name = grafana
user = root
password =
url =
ssl_mode = disable
ca_cert_path =
client_key_path =
client_cert_path =
server_cert_name =
path = /var/lib/grafana/grafana.db
max_idle_conn = 2
max_open_conn = 0
conn_max_lifetime = 14400
log_queries = false
cache_mode = shared
wal = true
query_retries = 0
transaction_retries = 5

# =============================================================================
# REMOTE CACHE (Redis integration)
# =============================================================================
[remote_cache]
type = redis
connstr = addr=redis:6379,pool_size=100,db=0,ssl=false

# =============================================================================
# DATA PROXY
# =============================================================================
[dataproxy]
logging = false
timeout = 300
dialTimeout = 30
keep_alive_seconds = 300
tls_handshake_timeout_seconds = 30
expect_continue_timeout_seconds = 1
max_conns_per_host = 0
max_idle_connections = 100
idle_conn_timeout_seconds = 300
send_user_header = false
response_limit = 0
row_limit = 1000000

# =============================================================================
# ANALYTICS (Disabled for privacy)
# =============================================================================
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
google_analytics_ua_id =
google_analytics_4_id =
google_tag_manager_id =
rudderstack_write_key =
rudderstack_data_plane_url =
rudderstack_sdk_url =
rudderstack_config_url =
intercom_secret =
application_insights_connection_string =
application_insights_endpoint_url =
feedback_links_enabled = true

# =============================================================================
# SECURITY
# =============================================================================
[security]
disable_initial_admin_creation = false
admin_user = admin
admin_password =
admin_email = admin@mahoun.internal
secret_key =
disable_gravatar = true
data_source_proxy_whitelist =
disable_brute_force_login_protection = false
cookie_secure = true
cookie_samesite = strict
allow_embedding = false
strict_transport_security = true
strict_transport_security_max_age_seconds = 86400
strict_transport_security_preload = false
strict_transport_security_subdomains = false
x_content_type_options = true
x_xss_protection = true
content_security_policy = true
content_security_policy_template = """script-src 'self' 'unsafe-eval' 'unsafe-inline' 'strict-dynamic' $NONCE;object-src 'none';font-src 'self';style-src 'self' 'unsafe-inline' blob:;img-src * data:;base-uri 'self';connect-src 'self' grafana.com ws://$ROOT_PATH wss://$ROOT_PATH;manifest-src 'self';media-src 'none';form-action 'self';"""
content_security_policy_report_only = false
cookie_samesite_disabled = false
cookie_samesite_lax = false
csrf_trusted_origins = 
csrf_additional_headers =
angular_support_enabled = false
hide_version = true

# =============================================================================
# SNAPSHOTS (Disabled for security)
# =============================================================================
[snapshots]
external_enabled = false
external_snapshot_url =
external_snapshot_name =
snapshot_remove_expired = true
snapshot_TTL_days = 90

# =============================================================================
# DASHBOARDS
# =============================================================================
[dashboards]
versions_to_keep = 20
min_refresh_interval = 5s
default_home_dashboard_path =

# =============================================================================
# USERS
# =============================================================================
[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_id = 1
auto_assign_org_role = Viewer
verify_email_enabled = false
login_hint = email or username
password_hint = password
default_theme = dark
default_language = en-US
home_page =
external_manage_link_url =
external_manage_link_name =
external_manage_info =
viewers_can_edit = false
editors_can_admin = false
user_invite_max_lifetime_duration = 24h
hidden_users =

# =============================================================================
# AUTH
# =============================================================================
[auth]
login_cookie_name = grafana_session
login_maximum_inactive_lifetime_duration = 7d
login_maximum_lifetime_duration = 30d
token_rotation_interval_minutes = 10
disable_login_form = false
disable_signout_menu = false
signout_redirect_url =
oauth_auto_login = false
oauth_state_cookie_max_age = 600
api_key_max_seconds_to_live = -1
sigv4_auth_enabled = false
sigv4_verbose_logging = false

# =============================================================================
# AUTH - ANONYMOUS
# =============================================================================
[auth.anonymous]
enabled = false
org_name = Main Org.
org_role = Viewer
hide_version = false

# =============================================================================
# AUTH - BASIC
# =============================================================================
[auth.basic]
enabled = true
password_reset_disabled = false

# =============================================================================
# AUTH - PROXY (Disabled)
# =============================================================================
[auth.proxy]
enabled = false
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = true
sync_ttl = 60
whitelist =
headers =
headers_encoded = false
enable_login_token = false

# =============================================================================
# SMTP / EMAIL (Configure for production)
# =============================================================================
[smtp]
enabled = false
host = localhost:25
user =
password =
cert_file =
key_file =
skip_verify = false
from_address = admin@grafana.localhost
from_name = Grafana
ehlo_identity =
startTLS_policy =

# =============================================================================
# ALERTING
# =============================================================================
[alerting]
enabled = true
execute_alerts = true
error_or_timeout = alerting
nodata_or_nullvalues = no_data
concurrent_render_limit = 5
evaluation_timeout_seconds = 30
notification_timeout_seconds = 30
max_attempts = 3
min_interval_seconds = 1
max_annotation_age =
max_annotations_to_keep =

# =============================================================================
# UNIFIED ALERTING
# =============================================================================
[unified_alerting]
enabled = true
disabled_orgs =
admin_config_poll_interval = 60s
alertmanager_config_poll_interval = 60s
ha_listen_address = 0.0.0.0:9094
ha_advertise_address =
ha_peers =
ha_peer_timeout = 15s
ha_gossip_interval = 200ms
ha_push_pull_interval = 60s
ha_redis_address =
ha_redis_username =
ha_redis_password =
ha_redis_db = 0
ha_redis_prefix = grafana_ha_
ha_redis_cluster_mode_enabled = false
execute_alerts = true
evaluation_timeout = 30s
max_attempts = 3
min_interval = 10s
max_annotation_age = 0
max_annotations_to_keep = 0
scheduler_tick_interval = 200ms
scheduler_worker_limit_multiplier = 1
reserved_labels =

# =============================================================================
# EXPLORE
# =============================================================================
[explore]
enabled = true

# =============================================================================
# METRICS (Prometheus)
# =============================================================================
[metrics]
enabled = true
interval_seconds = 10
disable_total_stats = false
basic_auth_username =
basic_auth_password =

# =============================================================================
# GRAFANA.COM INTEGRATION (Disabled)
# =============================================================================
[grafana_com]
url = https://grafana.com

# =============================================================================
# DISTRIBUTED TRACING
# =============================================================================
[tracing.jaeger]
address =
always_included_tag =
sampler_type =
sampler_param =
sampling_server_url =
zipkin_propagation = false
disable_shared_zipkin_spans = false

[tracing.opentelemetry.jaeger]
address =
propagation =

# =============================================================================
# EXTERNAL IMAGE STORAGE (Disabled)
# =============================================================================
[external_image_storage]
provider =

# =============================================================================
# RENDERING (For PDF/PNG export)
# =============================================================================
[rendering]
server_url =
callback_url =
concurrent_render_request_limit = 30
rendering_timeout = 60s
rendering_requests_per_user_per_minute = 5

# =============================================================================
# PANELS
# =============================================================================
[panels]
enable_alpha = false
disable_sanitize_html = false

# =============================================================================
# PLUGINS
# =============================================================================
[plugins]
enable_alpha = false
app_tls_skip_verify_insecure = false
allow_loading_unsigned_plugins =
marketplace_url = https://grafana.com/grafana/plugins/
grafana_com_url = https://grafana.com

# =============================================================================
# LIVE (WebSocket support)
# =============================================================================
[live]
max_connections = 100
allowed_origins =
ha_engine =
ha_engine_address = 127.0.0.1:6379

# =============================================================================
# QUERY HISTORY
# =============================================================================
[query_history]
enabled = true

# =============================================================================
# FEATURE TOGGLES
# =============================================================================
[feature_toggles]
enable = 
publicDashboards = true
panelTitleSearch = true
tempoSearch = true
tempoBackendSearch = true
traceqlEditor = true
prometheusWideSeries = true
prometheusDataplane = true
lokiExperimentalStreaming = true
lokiLogsDataplane = true
lokiMetricDataplane = true

# =============================================================================
# DATE FORMATS
# =============================================================================
[date_formats]
full_date = YYYY-MM-DD HH:mm:ss
interval_second = HH:mm:ss
interval_minute = HH:mm
interval_hour = MM/DD HH:mm
interval_day = MM/DD
interval_month = YYYY-MM
interval_year = YYYY
use_browser_locale = false
default_timezone = UTC

# =============================================================================
# EXPRESSIONS
# =============================================================================
[expressions]
enabled = true

# =============================================================================
# GEOMAP
# =============================================================================
[geomap]
default_baselayer_config =
enable_custom_baselayers = true

# =============================================================================
# UNIFIEDSTORAGE (Experimental)
# =============================================================================
[unifiedstorage]
enabled = false
