# ============================================================================
# MAHOUN Grafana Dashboard Provisioning
# ============================================================================
# Purpose: Auto-provision all monitoring dashboards
# ============================================================================

apiVersion: 1

providers:
  # ==========================================================================
  # PLATFORM DASHBOARDS
  # ==========================================================================
  - name: 'MAHOUN Platform'
    orgId: 1
    folder: 'Platform'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/platform
      foldersFromFilesStructure: true

  # ==========================================================================
  # GOVERNANCE DASHBOARDS
  # ==========================================================================
  - name: 'Governance'
    orgId: 1
    folder: 'Governance'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/governance

  # ==========================================================================
  # DATABASE DASHBOARDS
  # ==========================================================================
  - name: 'Databases'
    orgId: 1
    folder: 'Databases'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/databases

  # ==========================================================================
  # INFRASTRUCTURE DASHBOARDS
  # ==========================================================================
  - name: 'Infrastructure'
    orgId: 1
    folder: 'Infrastructure'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/infrastructure

  # ==========================================================================
  # APPLICATION DASHBOARDS
  # ==========================================================================
  - name: 'Applications'
    orgId: 1
    folder: 'Applications'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/applications

  # ==========================================================================
  # BUSINESS METRICS DASHBOARDS
  # ==========================================================================
  - name: 'Business Metrics'
    orgId: 1
    folder: 'Business'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 60
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/business
