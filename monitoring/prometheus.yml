# ============================================================================
# MAHOUN Governance Kernel - Prometheus Configuration
# ============================================================================
#
# Enterprise monitoring configuration with:
# - Service discovery
# - Alert rules
# - Recording rules
# - Multi-target scraping
# - Security
#
# ============================================================================

global:
  # Scrape configuration
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  
  # External labels (for federation)
  external_labels:
    cluster: 'mahoun-production'
    environment: 'production'
    region: 'us-west-2'

# ============================================================================
# Rule Files
# ============================================================================

rule_files:
  - "/etc/prometheus/rules/*.yml"
  - "/etc/prometheus/alerts/*.yml"

# ============================================================================
# Alertmanager Configuration
# ============================================================================

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
      scheme: http
      timeout: 10s
      api_version: v2

# ============================================================================
# Scrape Configurations
# ============================================================================

scrape_configs:

  # ============================================================================
  # Governance Kernel - Direct Scraping
  # ============================================================================
  
  - job_name: 'governance-kernel'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    
    # Static targets (for docker-compose)
    static_configs:
      - targets:
        - 'governance-kernel:9090'
        labels:
          service: 'governance-kernel'
          component: 'runtime'
          tier: 'governance'
    
    # Metric relabeling
    metric_relabel_configs:
      # Add instance ID
      - source_labels: [__address__]
        target_label: instance_id
        replacement: '${1}'
      
      # Add deployment info
      - target_label: deployment
        replacement: 'docker-compose'

  # ============================================================================
  # Kubernetes Service Discovery
  # ============================================================================
  
  - job_name: 'kubernetes-governance-kernel'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - mahoun-governance
    
    relabel_configs:
      # Only scrape pods with prometheus.io/scrape: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      
      # Use custom metrics path if specified
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      
      # Use custom port if specified
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      
      # Add Kubernetes metadata
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
      
      - source_labels: [__meta_kubernetes_pod_node_name]
        action: replace
        target_label: kubernetes_node

  # ============================================================================
  # Kubernetes Services Discovery
  # ============================================================================
  
  - job_name: 'kubernetes-services'
    kubernetes_sd_configs:
      - role: service
        namespaces:
          names:
            - mahoun-governance
    
    relabel_configs:
      # Only services with prometheus.io/scrape: true
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
        action: replace
        target_label: __scheme__
        regex: (https?)
      
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      
      - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
      
      # Add service metadata
      - action: labelmap
        regex: __meta_kubernetes_service_label_(.+)
      
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      
      - source_labels: [__meta_kubernetes_service_name]
        action: replace
        target_label: kubernetes_service_name

  # ============================================================================
  # Infrastructure Monitoring
  # ============================================================================
  
  - job_name: 'kubernetes-nodes'
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    
    kubernetes_sd_configs:
      - role: node
    
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics

  # ============================================================================
  # Application Performance Monitoring
  # ============================================================================
  
  - job_name: 'governance-kernel-health'
    scrape_interval: 30s
    scrape_timeout: 5s
    metrics_path: /health
    scheme: http
    
    static_configs:
      - targets:
        - 'governance-kernel:8080'
    
    # Custom metrics transformation for health endpoint
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'up'
        target_label: __name__
        replacement: 'governance_kernel_health_up'

# ============================================================================
# Storage Configuration
# ============================================================================

# Local storage configuration
storage:
  tsdb:
    path: /prometheus/data
    retention.time: 15d
    retention.size: 50GB
    wal-compression: true

# Remote write (for long-term storage)
remote_write:
  - url: "https://prometheus-remote-write.mahoun.ai/api/v1/write"
    queue_config:
      max_samples_per_send: 10000
      max_shards: 200
      capacity: 100000
    
    # Authentication
    basic_auth:
      username: mahoun-governance
      password_file: /etc/prometheus/secrets/remote-write-password
    
    # Metric selection for remote write
    write_relabel_configs:
      # Only send governance-related metrics
      - source_labels: [__name__]
        regex: 'governance_.*|up|scrape_.*'
        action: keep

