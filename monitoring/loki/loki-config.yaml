# ============================================================================
# MAHOUN Loki Configuration - Enterprise Log Aggregation
# ============================================================================
# Purpose: Centralized logging for all MAHOUN platform services
# Features: Multi-tenancy, retention policies, compression
# ============================================================================

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info
  log_format: json

# =============================================================================
# INGESTER CONFIGURATION
# =============================================================================
ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  
  # Chunk size and idle timeout
  chunk_idle_period: 5m
  chunk_block_size: 262144
  chunk_retain_period: 30s
  max_chunk_age: 1h
  
  # Performance tuning
  max_transfer_retries: 0
  wal:
    enabled: true
    dir: /loki/wal
    checkpoint_duration: 5m
    flush_on_shutdown: true
    replay_memory_ceiling: 4GB

# =============================================================================
# SCHEMA CONFIGURATION
# =============================================================================
schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

# =============================================================================
# STORAGE CONFIGURATION
# =============================================================================
storage_config:
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    cache_location: /loki/boltdb-shipper-cache
    cache_ttl: 24h
    shared_store: filesystem
  
  filesystem:
    directory: /loki/chunks

# =============================================================================
# COMPACTOR CONFIGURATION
# =============================================================================
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

# =============================================================================
# LIMITS CONFIGURATION
# =============================================================================
limits_config:
  # Ingestion limits
  enforce_metric_name: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # 7 days
  
  # Rate limits
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  max_concurrent_tail_requests: 10
  
  # Query limits
  max_query_length: 721h  # 30 days
  max_query_parallelism: 32
  max_streams_per_user: 10000
  max_entries_limit_per_query: 10000
  max_cache_freshness_per_query: 10m
  
  # Performance
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 15MB
  split_queries_by_interval: 15m

# =============================================================================
# CHUNK CACHE CONFIGURATION
# =============================================================================
chunk_store_config:
  max_look_back_period: 720h  # 30 days
  chunk_cache_config:
    enable_fifocache: true
    fifocache:
      max_size_bytes: 1GB
      ttl: 1h

# =============================================================================
# QUERY RANGE CONFIGURATION
# =============================================================================
query_range:
  align_queries_with_step: true
  cache_results: true
  max_retries: 5
  
  results_cache:
    cache:
      enable_fifocache: true
      fifocache:
        max_size_bytes: 500MB
        ttl: 10m

# =============================================================================
# FRONTEND CONFIGURATION
# =============================================================================
frontend:
  log_queries_longer_than: 5s
  compress_responses: true
  max_outstanding_per_tenant: 2048

# =============================================================================
# RULER CONFIGURATION (Alerting)
# =============================================================================
ruler:
  alertmanager_url: http://alertmanager:9093
  enable_api: true
  enable_alertmanager_v2: true
  
  storage:
    type: local
    local:
      directory: /loki/rules
  
  rule_path: /loki/rules-temp
  ring:
    kvstore:
      store: inmemory

# =============================================================================
# TABLE MANAGER (Retention Policies)
# =============================================================================
table_manager:
  retention_deletes_enabled: true
  retention_period: 720h  # 30 days

# =============================================================================
# ANALYTICS
# =============================================================================
analytics:
  reporting_enabled: false
