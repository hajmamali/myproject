# ============================================================================
# MAHOUN Promtail Configuration - Log Shipping Agent
# ============================================================================
# Purpose: Ship logs from all sources to Loki
# Features: Multi-pipeline parsing, label extraction, filtering
# ============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

# =============================================================================
# POSITIONS FILE (Track read positions)
# =============================================================================
positions:
  filename: /tmp/positions.yaml
  sync_period: 10s
  ignore_invalid_yaml: false

# =============================================================================
# LOKI CLIENT CONFIGURATION
# =============================================================================
clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576  # 1MB
    
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10
    
    timeout: 10s
    
    external_labels:
      cluster: mahoun-production
      environment: production

# =============================================================================
# SCRAPE CONFIGURATIONS
# =============================================================================
scrape_configs:
  # ---------------------------------------------------------------------------
  # DOCKER CONTAINER LOGS (All Services)
  # ---------------------------------------------------------------------------
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.mahoun.service"]
    
    relabel_configs:
      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      
      # Extract service label
      - source_labels: ['__meta_docker_container_label_com_mahoun_service']
        target_label: 'service'
      
      # Extract environment
      - source_labels: ['__meta_docker_container_label_com_mahoun_environment']
        target_label: 'environment'
      
      # Extract component
      - source_labels: ['__meta_docker_container_label_com_mahoun_component']
        target_label: 'component'
      
      # Container ID (short)
      - source_labels: ['__meta_docker_container_id']
        regex: '(.{12})'
        target_label: 'container_id'
    
    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            logger: logger
            module: module
            request_id: request_id
            user_id: user_id
      
      # Extract log level
      - labels:
          level:
      
      # Timestamp extraction
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      
      # Drop debug logs in production (optional)
      # - match:
      #     selector: '{level="debug"}'
      #     action: drop

  # ---------------------------------------------------------------------------
  # GOVERNANCE KERNEL LOGS (Structured JSON)
  # ---------------------------------------------------------------------------
  - job_name: governance-kernel
    static_configs:
      - targets:
          - localhost
        labels:
          job: governance-kernel
          service: governance-kernel
          tier: core
          __path__: /var/lib/docker/containers/*governance-kernel*/*.log
    
    pipeline_stages:
      - docker: {}
      
      - json:
          expressions:
            level: level
            message: msg
            timestamp: timestamp
            validation_id: validation_id
            policy_id: policy_id
            actor_id: actor_id
            decision: decision
            duration_ms: duration_ms
      
      - labels:
          level:
          validation_id:
          decision:
      
      - timestamp:
          source: timestamp
          format: RFC3339

  # ---------------------------------------------------------------------------
  # API SERVER LOGS (FastAPI / Uvicorn)
  # ---------------------------------------------------------------------------
  - job_name: api-server
    static_configs:
      - targets:
          - localhost
        labels:
          job: api-server
          service: api-server
          tier: api
          __path__: /var/lib/docker/containers/*api-server*/*.log
    
    pipeline_stages:
      - docker: {}
      
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            method: method
            path: path
            status_code: status_code
            duration: duration
            request_id: request_id
            user_agent: user_agent
            ip: client_ip
      
      - labels:
          level:
          method:
          status_code:
      
      # Extract endpoint from path
      - regex:
          expression: '^(?P<endpoint>/api/v\d+/\w+)'
          source: path
      
      - labels:
          endpoint:
      
      - timestamp:
          source: timestamp
          format: RFC3339

  # ---------------------------------------------------------------------------
  # NEO4J LOGS (Query logs, debug logs)
  # ---------------------------------------------------------------------------
  - job_name: neo4j
    static_configs:
      - targets:
          - localhost
        labels:
          job: neo4j
          service: neo4j
          tier: database
          __path__: /var/lib/docker/containers/*neo4j*/*.log
    
    pipeline_stages:
      - docker: {}
      
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+\+\d{4}) (?P<level>\w+)\s+\[(?P<thread>[^\]]+)\] (?P<logger>[^\s]+) - (?P<message>.*)'
      
      - labels:
          level:
          logger:
      
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05.000-0700'
      
      # Extract query execution time
      - regex:
          expression: 'query - (?P<query_time>\d+) ms:'
          source: message
      
      - labels:
          query_time:

  # ---------------------------------------------------------------------------
  # POSTGRESQL LOGS
  # ---------------------------------------------------------------------------
  - job_name: postgresql
    static_configs:
      - targets:
          - localhost
        labels:
          job: postgresql
          service: postgresql
          tier: database
          __path__: /var/lib/docker/containers/*postgres*/*.log
    
    pipeline_stages:
      - docker: {}
      
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+ \w+) \[(?P<pid>\d+)\] (?P<level>\w+):\s+(?P<message>.*)'
      
      - labels:
          level:
      
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05.000 MST'
      
      # Detect slow queries
      - regex:
          expression: 'duration: (?P<duration>\d+\.\d+) ms'
          source: message
      
      - labels:
          duration:

  # ---------------------------------------------------------------------------
  # REDIS LOGS
  # ---------------------------------------------------------------------------
  - job_name: redis
    static_configs:
      - targets:
          - localhost
        labels:
          job: redis
          service: redis
          tier: cache
          __path__: /var/lib/docker/containers/*redis*/*.log
    
    pipeline_stages:
      - docker: {}
      
      - regex:
          expression: '^(?P<pid>\d+):(?P<role>\w+) (?P<timestamp>[^\s]+) (?P<level>.) (?P<message>.*)'
      
      - labels:
          level:
          role:
      
      - timestamp:
          source: timestamp
          format: '02 Jan 2006 15:04:05.000'

  # ---------------------------------------------------------------------------
  # CHROMADB LOGS
  # ---------------------------------------------------------------------------
  - job_name: chromadb
    static_configs:
      - targets:
          - localhost
        labels:
          job: chromadb
          service: chromadb
          tier: database
          __path__: /var/lib/docker/containers/*chromadb*/*.log
    
    pipeline_stages:
      - docker: {}
      
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            collection: collection
            operation: operation
            duration: duration
      
      - labels:
          level:
          operation:
      
      - timestamp:
          source: timestamp
          format: RFC3339

  # ---------------------------------------------------------------------------
  # SYSTEM LOGS (Host level)
  # ---------------------------------------------------------------------------
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/syslog
    
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\w+ \d+ \d+:\d+:\d+) (?P<host>\S+) (?P<process>\S+?)(\[(?P<pid>\d+)\])?: (?P<message>.*)'
      
      - labels:
          host:
          process:
      
      - timestamp:
          source: timestamp
          format: 'Jan _2 15:04:05'

# =============================================================================
# LIMITS CONFIGURATION
# =============================================================================
limits_config:
  readline_rate: 10000
  readline_burst: 20000
  readline_rate_enabled: true
  readline_rate_drop: false

# =============================================================================
# TARGET CONFIGURATION
# =============================================================================
target_config:
  sync_period: 10s
