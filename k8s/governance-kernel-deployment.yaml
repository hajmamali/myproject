# ============================================================================
# MAHOUN Governance Kernel - Kubernetes Deployment
# ============================================================================
#
# Enterprise-grade Kubernetes deployment with:
# - High Availability (3+ replicas)
# - Security hardening (PSP compliance)
# - Resource management
# - Health checks
# - Service mesh ready
# - Multi-zone deployment
#
# Usage:
#   kubectl apply -f k8s/
#
# ============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: mahoun-governance
  labels:
    name: mahoun-governance
    security.policy: strict
    network.policy: enabled
    governance.mahoun.ai/kernel: "true"
  annotations:
    description: "MAHOUN Governance Kernel - Zero-Trust Runtime"

---

# ============================================================================
# ConfigMap - Configuration
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: governance-kernel-config
  namespace: mahoun-governance
  labels:
    app: governance-kernel
    component: config
data:
  # Server configuration
  MAHOUN_ENV: "production"
  MAHOUN_GOVERNANCE_PORT: "8080"
  MAHOUN_METRICS_PORT: "9090"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  
  # Governance settings
  GOVERNANCE_MODE: "STRICT"
  GOVERNANCE_LOG_LEVEL: "INFO"
  GOVERNANCE_AUDIT_ENABLED: "true"
  
  # Performance tuning
  GOVERNANCE_WORKER_THREADS: "4"
  GOVERNANCE_MAX_CONNECTIONS: "1000"
  GOVERNANCE_REQUEST_TIMEOUT: "30"

---

# ============================================================================
# Secret - Sensitive Configuration
# ============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: governance-kernel-secrets
  namespace: mahoun-governance
  labels:
    app: governance-kernel
    component: secrets
type: Opaque
data:
  # Base64 encoded values (replace with actual secrets)
  GOVERNANCE_API_KEY: "bWFob3VuLWtlcm5lbC1hcGkta2V5LTIwMjY="
  METRICS_AUTH_TOKEN: "bWV0cmljcy1hdXRoLXRva2VuLTIwMjY="
  TLS_CERT_PASSWORD: "dGxzLWNlcnQtcGFzc3dvcmQtMjAyNg=="

---

# ============================================================================
# ServiceAccount & RBAC
# ============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: governance-kernel
  namespace: mahoun-governance
  labels:
    app: governance-kernel
    component: rbac
automountServiceAccountToken: false  # Security hardening

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: governance-kernel-role
  namespace: mahoun-governance
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: governance-kernel-binding
  namespace: mahoun-governance
subjects:
- kind: ServiceAccount
  name: governance-kernel
  namespace: mahoun-governance
roleRef:
  kind: Role
  name: governance-kernel-role
  apiGroup: rbac.authorization.k8s.io

---

# ============================================================================
# Deployment - Governance Kernel
# ============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: governance-kernel
  namespace: mahoun-governance
  labels:
    app: governance-kernel
    component: runtime
    version: v1.0.0
    tier: governance
  annotations:
    deployment.kubernetes.io/revision: "1"
    description: "MAHOUN Governance Kernel - Production Deployment"
spec:
  replicas: 3  # High availability
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  
  selector:
    matchLabels:
      app: governance-kernel
      component: runtime
  
  template:
    metadata:
      labels:
        app: governance-kernel
        component: runtime
        version: v1.0.0
        tier: governance
      annotations:
        # Prometheus scraping
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        
        # Security annotations
        container.apparmor.security.beta.kubernetes.io/governance-kernel: runtime/default
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
    
    spec:
      serviceAccountName: governance-kernel
      automountServiceAccountToken: false
      
      # Security context (pod-level)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      
      # Anti-affinity for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - governance-kernel
              topologyKey: kubernetes.io/hostname
      
      # Node selection
      nodeSelector:
        kubernetes.io/os: linux
        node.kubernetes.io/instance-type: "standard"
      
      # Tolerations for dedicated nodes
      tolerations:
      - key: "governance.mahoun.ai/dedicated"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      
      containers:
      - name: governance-kernel
        image: mahoun-kernel:v1.0.0
        imagePullPolicy: IfNotPresent
        
        ports:
        - name: governance
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        # Environment from ConfigMap and Secret
        envFrom:
        - configMapRef:
            name: governance-kernel-config
        - secretRef:
            name: governance-kernel-secrets
        
        # Security context (container-level)
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
        
        # Resource management
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
            ephemeral-storage: "64Mi"
          limits:
            memory: "256Mi"
            cpu: "500m"
            ephemeral-storage: "128Mi"
        
        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: governance
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        
        # Readiness probe
        readinessProbe:
          httpGet:
            path: /health
            port: governance
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
        
        # Startup probe (for slow starts)
        startupProbe:
          httpGet:
            path: /health
            port: governance
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 10
        
        # Temporary filesystem mounts
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: cache-volume
          mountPath: /app/cache
      
      volumes:
      - name: tmp-volume
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      - name: cache-volume
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
      
      # DNS configuration
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
        - name: ndots
          value: "2"
        - name: edns0
      
      # Restart policy
      restartPolicy: Always
      
      # Termination grace period
      terminationGracePeriodSeconds: 30

---

# ============================================================================
# Service - Load Balancer
# ============================================================================

apiVersion: v1
kind: Service
metadata:
  name: governance-kernel-service
  namespace: mahoun-governance
  labels:
    app: governance-kernel
    component: service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
spec:
  type: ClusterIP  # Change to LoadBalancer for external access
  sessionAffinity: None
  
  ports:
  - name: governance
    port: 8080
    targetPort: governance
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  
  selector:
    app: governance-kernel
    component: runtime

---

# ============================================================================
# Service - Headless (for StatefulSet if needed)
# ============================================================================

apiVersion: v1
kind: Service
metadata:
  name: governance-kernel-headless
  namespace: mahoun-governance
  labels:
    app: governance-kernel
    component: headless-service
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  
  ports:
  - name: governance
    port: 8080
    targetPort: governance
    protocol: TCP
  
  selector:
    app: governance-kernel
    component: runtime

---

# ============================================================================
# HorizontalPodAutoscaler - Auto-scaling
# ============================================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: governance-kernel-hpa
  namespace: mahoun-governance
  labels:
    app: governance-kernel
    component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: governance-kernel
  
  minReplicas: 3
  maxReplicas: 20
  
  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  
  # Memory-based scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  
  # Custom metrics (if available)
  - type: Pods
    pods:
      metric:
        name: governance_requests_per_second
      target:
        type: AverageValue
        averageValue: "50"
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

---

# ============================================================================
# PodDisruptionBudget - Availability
# ============================================================================

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: governance-kernel-pdb
  namespace: mahoun-governance
  labels:
    app: governance-kernel
    component: availability
spec:
  minAvailable: 2  # Always keep 2 pods running
  selector:
    matchLabels:
      app: governance-kernel
      component: runtime

---

# ============================================================================
# NetworkPolicy - Security
# ============================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: governance-kernel-netpol
  namespace: mahoun-governance
  labels:
    app: governance-kernel
    component: network-policy
spec:
  podSelector:
    matchLabels:
      app: governance-kernel
  
  policyTypes:
  - Ingress
  - Egress
  
  # Ingress rules
  ingress:
  # Allow from same namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: mahoun-governance
    ports:
    - protocol: TCP
      port: 8080
  
  # Allow from monitoring namespace (Prometheus)
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  
  # Allow from application namespaces
  - from:
    - namespaceSelector:
        matchLabels:
          governance.mahoun.ai/client: "allowed"
    ports:
    - protocol: TCP
      port: 8080
  
  # Egress rules (minimal)
  egress:
  # DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
  
  # Allow to Kubernetes API
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: TCP
      port: 443