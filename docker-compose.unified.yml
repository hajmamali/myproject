# ============================================================================
# MAHOUN Unified Infrastructure Stack - Production-Ready Architecture  
# ============================================================================
# Purpose: Complete microservices deployment with governance integration
# Architecture: Governance Kernel + API Service + MCP Service + Databases
# Performance: Optimized resource allocation, health checks, monitoring
# Security: Network isolation, non-root execution, capability restrictions
# ============================================================================

version: '3.9'

# ============================================================================
# Network Topology - Three-Tier Architecture
# ============================================================================
networks:
  # DMZ Network - External traffic entry point
  dmz-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
    driver_opts:
      com.docker.network.bridge.name: mahoun-dmz
      
  # Internal Network - Service-to-service communication  
  internal-net:
    driver: bridge
    internal: false  # Allow external for development, restrict in production
    ipam:
      config:
        - subnet: 172.21.0.0/24
    driver_opts:
      com.docker.network.bridge.name: mahoun-internal
      
  # Database Network - Backend data tier (most restricted)
  db-net:
    driver: bridge
    internal: true  # No external access
    ipam:
      config:
        - subnet: 172.22.0.0/24
    driver_opts:
      com.docker.network.bridge.name: mahoun-db
      encrypted: "true"

# ============================================================================
# Volume Management - Persistent Storage Strategy
# ============================================================================
volumes:
  # Governance data (critical, replicated)
  governance-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MAHOUN_DATA_PATH:-./data/governance}
  
  # API service data (application state)
  api-data:
    driver: local
    driver_opts:
      type: none  
      o: bind
      device: ${MAHOUN_DATA_PATH:-./data/api}
  
  # Database volumes (high-performance requirements)
  postgres-data:
    driver: local
    name: mahoun-postgres-data
    
  neo4j-data:
    driver: local
    name: mahoun-neo4j-data
    
  redis-data:
    driver: local
    name: mahoun-redis-data
    
  chromadb-data:
    driver: local  
    name: mahoun-chromadb-data
  
  # Monitoring data
  prometheus-data:
    driver: local
    name: mahoun-prometheus-data
    
  grafana-data:
    driver: local
    name: mahoun-grafana-data

# ============================================================================
# Service Definitions - Microservices Architecture
# ============================================================================
services:

  # ========================================
  # Governance Kernel - Core Security & Policy Enforcement
  # ========================================
  governance-kernel:
    build:
      context: .
      dockerfile: Dockerfile.kernel
      target: runtime
      args:
        PYTHON_VERSION: 3.12.7
        ALPINE_VERSION: 3.19
      cache_from:
        - mahoun/governance-kernel:cache
    image: mahoun/governance-kernel:latest
    container_name: mahoun-governance-kernel
    hostname: governance-kernel
    restart: unless-stopped
    
    # Security Context
    user: "1001:1001"
    read_only: true
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    # Resource Management
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    
    # Environment Configuration
    environment:
      - MAHOUN_ENV=${MAHOUN_ENV:-production}
      - MAHOUN_SERVICE=governance-kernel
      - MAHOUN_GUARD_MODE=${MAHOUN_GUARD_MODE:-STRICT}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONPATH=/app
      - TZ=UTC
    
    # Temporary filesystems (security)
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64m
      - /app/audit:noexec,nosuid,nodev,size=32m
    
    # Volume mounts
    volumes:
      - governance-data:/app/data:rw
      - type: tmpfs
        target: /tmp/governance
        tmpfs:
          size: 32M
          mode: 0700
    
    # Network configuration
    networks:
      - internal-net
    
    # Port exposure (internal only)
    expose:
      - "8080"
    
    # Health monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "governance-kernel"

  # ========================================  
  # API Service - FastAPI Application Layer
  # ========================================
  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: runtime
      args:
        PYTHON_VERSION: 3.12.7
        ALPINE_VERSION: 3.19
      cache_from:
        - mahoun/api-server:cache
    image: mahoun/api-server:latest
    container_name: mahoun-api-server
    hostname: api-server
    restart: unless-stopped
    
    # Service Dependencies
    depends_on:
      governance-kernel:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
        
    # Security Context
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    # Resource Management  
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '1.0'
    
    # Environment Configuration
    environment:
      - MAHOUN_ENV=${MAHOUN_ENV:-production}
      - MAHOUN_SERVICE=api-server
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONPATH=/app
      - TZ=UTC
      
      # Database connections
      - DB_POSTGRES_HOST=postgres
      - DB_POSTGRES_PORT=5432
      - DB_POSTGRES_DATABASE=${DB_POSTGRES_DATABASE:-mahoun}
      - DB_POSTGRES_USER=${DB_POSTGRES_USER:-mahoun}
      - DB_POSTGRES_PASSWORD=${DB_POSTGRES_PASSWORD}
      
      - DB_REDIS_HOST=redis
      - DB_REDIS_PORT=6379
      - DB_REDIS_DATABASE=${DB_REDIS_DATABASE:-0}
      
      - MAHOUN_NEO4J_URI=bolt://neo4j:7687
      - DB_NEO4J_USER=${DB_NEO4J_USER:-neo4j}
      - DB_NEO4J_PASSWORD=${DB_NEO4J_PASSWORD}
      
      # Security configuration
      - SECURITY_JWT_SECRET=${SECURITY_JWT_SECRET}
      - MAHOUN_ALLOW_UNGOVERNED_SEEDING=${MAHOUN_ALLOW_UNGOVERNED_SEEDING:-false}
      
      # Service URLs
      - GOVERNANCE_SERVICE_URL=http://governance-kernel:8080
      - MCP_SERVICE_URL=http://mcp-server:8001
      
      # CORS settings
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - MAHOUN_ALLOWED_HOST=${MAHOUN_ALLOWED_HOST:-*}
      
    # Temporary filesystems
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=256m
      - /app/uploads:noexec,nosuid,nodev,size=128m
    
    # Volume mounts
    volumes:
      - api-data:/app/data:rw
      - type: tmpfs
        target: /tmp/api
        tmpfs:
          size: 128M
          mode: 0700
    
    # Network configuration
    networks:
      - dmz-net
      - internal-net
      - db-net
    
    # Port exposure (external access)
    ports:
      - "${API_PORT:-8000}:8000"
    
    # Health monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    
    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "api-server"

  # ========================================
  # MCP Service - Model Context Protocol Server  
  # ========================================
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      target: runtime
      args:
        PYTHON_VERSION: 3.12.7
        ALPINE_VERSION: 3.19
      cache_from:
        - mahoun/mcp-server:cache
    image: mahoun/mcp-server:latest
    container_name: mahoun-mcp-server  
    hostname: mcp-server
    restart: unless-stopped
    
    # Service Dependencies
    depends_on:
      governance-kernel:
        condition: service_healthy
        
    # Security Context
    user: "1002:1002"
    read_only: true
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    # Resource Management (lightweight)
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.25'
    
    # Environment Configuration
    environment:
      - MAHOUN_ENV=${MAHOUN_ENV:-production}
      - MAHOUN_SERVICE=mcp-server
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONPATH=/app
      - TZ=UTC
      - GOVERNANCE_SERVICE_URL=http://governance-kernel:8080
      - API_SERVICE_URL=http://api-server:8000
    
    # Temporary filesystems
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=32m
    
    # Volume mounts (minimal)
    volumes:
      - type: tmpfs
        target: /tmp/mcp
        tmpfs:
          size: 32M
          mode: 0700
    
    # Network configuration
    networks:
      - internal-net
    
    # Port exposure (internal + external for development)
    ports:
      - "${MCP_PORT:-8001}:8001"
    expose:
      - "8001"
    
    # Health monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3" 
        tag: "mcp-server"

  # ========================================
  # Database Services - Data Persistence Layer
  # ========================================
  
  # PostgreSQL - Relational Data Store
  postgres:
    image: postgres:16.4-alpine
    container_name: mahoun-postgres
    hostname: postgres
    restart: unless-stopped
    
    # Security Context
    user: postgres
    read_only: false  # Database requires write access
    security_opt:
      - no-new-privileges:true
    
    # Resource Management
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    
    # Environment Configuration
    environment:
      - POSTGRES_DB=${DB_POSTGRES_DATABASE:-mahoun}
      - POSTGRES_USER=${DB_POSTGRES_USER:-mahoun}
      - POSTGRES_PASSWORD=${DB_POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
      - PGDATA=/var/lib/postgresql/data/pgdata
      
      # Performance tuning
      - POSTGRES_SHARED_BUFFERS=256MB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=512MB
      - POSTGRES_MAINTENANCE_WORK_MEM=64MB
      - POSTGRES_CHECKPOINT_COMPLETION_TARGET=0.9
      - POSTGRES_WAL_BUFFERS=16MB
      - POSTGRES_DEFAULT_STATISTICS_TARGET=100
      
    # Volume mounts
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 64M
    
    # Network configuration
    networks:
      - db-net
    
    # Port exposure (internal only)
    expose:
      - "5432"
    
    # Health monitoring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_POSTGRES_USER:-mahoun} -d ${DB_POSTGRES_DATABASE:-mahoun}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    # Logging
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
        tag: "postgres"

  # Redis - In-Memory Cache & Sessions
  redis:
    image: redis:7.2-alpine
    container_name: mahoun-redis
    hostname: redis  
    restart: unless-stopped
    
    # Security Context
    user: redis
    read_only: true
    security_opt:
      - no-new-privileges:true
    
    # Resource Management
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    
    # Command with security and performance options
    command: [
      "redis-server",
      "--appendonly", "yes",
      "--appendfsync", "everysec", 
      "--save", "900 1",
      "--save", "300 10",
      "--save", "60 10000",
      "--maxmemory", "256mb",
      "--maxmemory-policy", "allkeys-lru",
      "--tcp-keepalive", "300",
      "--timeout", "0"
    ]
    
    # Volume mounts
    volumes:
      - redis-data:/data
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 32M
    
    # Network configuration  
    networks:
      - db-net
    
    # Port exposure (internal only)
    expose:
      - "6379"
    
    # Health monitoring
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    
    # Logging
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
        tag: "redis"

  # Neo4j - Graph Database
  neo4j:
    image: neo4j:5.18-enterprise
    container_name: mahoun-neo4j
    hostname: neo4j
    restart: unless-stopped
    
    # Security Context
    user: "7474:7474"
    read_only: false  # Neo4j requires write access
    security_opt:
      - no-new-privileges:true
    
    # Resource Management
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    
    # Environment Configuration
    environment:
      - NEO4J_AUTH=neo4j/${DB_NEO4J_PASSWORD}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_EDITION=enterprise
      
      # Memory settings
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1g
      - NEO4J_dbms_memory_pagecache_size=512m
      
      # Performance tuning
      - NEO4J_dbms_query_cache_size=512
      - NEO4J_dbms_logs_query_enabled=false
      - NEO4J_dbms_logs_query_threshold=5s
      
      # Security settings
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
      
      # Plugin configuration
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      
      # Monitoring
      - NEO4J_metrics_prometheus_enabled=true
      - NEO4J_metrics_prometheus_endpoint=0.0.0.0:2004
    
    # Volume mounts
    volumes:
      - neo4j-data:/data
      - neo4j-data:/var/lib/neo4j/import
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 256M
    
    # Network configuration
    networks:
      - db-net
      - internal-net  # For monitoring
    
    # Port exposure (internal only)
    expose:
      - "7474"  # HTTP
      - "7687"  # Bolt
      - "2004"  # Metrics
    
    # Health monitoring
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${DB_NEO4J_PASSWORD}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Logging
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
        tag: "neo4j"

  # ChromaDB - Vector Database
  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: mahoun-chromadb
    hostname: chromadb
    restart: unless-stopped
    
    # Security Context
    user: "1000:1000"
    read_only: false  # ChromaDB requires write access
    security_opt:
      - no-new-privileges:true
    
    # Resource Management
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    
    # Environment Configuration
    environment:
      - CHROMA_SERVER_AUTH_CREDENTIALS_FILE=/chroma/auth/credentials
      - CHROMA_SERVER_AUTH_CREDENTIALS_PROVIDER=chromadb.auth.simple.SimpleAuthCredentialsProvider
      - CHROMA_SERVER_AUTH_PROVIDER=chromadb.auth.simple.SimpleAuthenticationServerProvider
      - ANONYMIZED_TELEMETRY=${CHROMA_ANONYMIZED_TELEMETRY:-false}
      - IS_PERSISTENT=true
      - PERSIST_DIRECTORY=/chroma/chroma
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
    
    # Volume mounts
    volumes:
      - chromadb-data:/chroma/chroma
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 128M
    
    # Network configuration
    networks:
      - db-net
    
    # Port exposure (internal only)
    expose:
      - "8000"
    
    # Health monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # Logging
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
        tag: "chromadb"

# ============================================================================
# Profile Configurations - Environment-Specific Deployments
# ============================================================================

# Development Profile
x-development: &development-overrides
  governance-kernel:
    environment:
      - MAHOUN_ENV=development
      - LOG_LEVEL=DEBUG
      - MAHOUN_GUARD_MODE=WARN
    ports:
      - "8080:8080"  # Expose for debugging
      
  api-server:
    environment:
      - MAHOUN_ENV=development
      - LOG_LEVEL=DEBUG
    volumes:
      - ./api:/app/api:ro  # Hot-reload
      - ./mahoun:/app/mahoun:ro
      
  mcp-server:
    environment:
      - MAHOUN_ENV=development
      - LOG_LEVEL=DEBUG

# Production Profile  
x-production: &production-overrides
  governance-kernel:
    environment:
      - MAHOUN_ENV=production
      - LOG_LEVEL=INFO
      - MAHOUN_GUARD_MODE=STRICT
    deploy:
      replicas: 2  # High availability
      
  api-server:
    environment:
      - MAHOUN_ENV=production  
      - LOG_LEVEL=INFO
    deploy:
      replicas: 3  # Load balancing

