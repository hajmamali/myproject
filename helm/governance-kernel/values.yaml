# ============================================================================
# MAHOUN Governance Kernel - Helm Chart Values
# ============================================================================
#
# Enterprise-grade Helm configuration with environment-specific overrides
#
# Usage:
#   helm install governance-kernel ./helm/governance-kernel
#   helm upgrade governance-kernel ./helm/governance-kernel -f values-prod.yaml
#
# ============================================================================

# Global settings
global:
  # Image registry configuration
  imageRegistry: "registry.mahoun.ai"
  imagePullSecrets:
    - name: mahoun-registry-secret
  
  # Environment
  environment: production
  
  # Security settings
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  
  # Monitoring
  monitoring:
    enabled: true
    prometheus:
      enabled: true
      namespace: monitoring
    grafana:
      enabled: true
    alertmanager:
      enabled: true

# ============================================================================
# Image Configuration
# ============================================================================

image:
  repository: mahoun-kernel
  tag: "v1.0.0"
  pullPolicy: IfNotPresent
  
  # Digest-based pinning for production (recommended)
  digest: ""  # sha256:abcdef123456...

# ============================================================================
# Deployment Configuration
# ============================================================================

deployment:
  # Replica management
  replicaCount: 3
  
  # Update strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  
  # Annotations
  annotations:
    deployment.kubernetes.io/revision: "1"
    description: "MAHOUN Governance Kernel - Helm Managed"
  
  # Pod template
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
    container.apparmor.security.beta.kubernetes.io/governance-kernel: runtime/default
    seccomp.security.alpha.kubernetes.io/pod: runtime/default
  
  podLabels:
    app.kubernetes.io/name: governance-kernel
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/version: "{{ .Chart.AppVersion }}"
    app.kubernetes.io/component: runtime
    app.kubernetes.io/part-of: mahoun-platform
    app.kubernetes.io/managed-by: helm

# ============================================================================
# Service Configuration
# ============================================================================

service:
  # Service type
  type: ClusterIP  # Options: ClusterIP, NodePort, LoadBalancer
  
  # Ports
  ports:
    governance:
      port: 8080
      targetPort: governance
      protocol: TCP
    metrics:
      port: 9090
      targetPort: metrics
      protocol: TCP
  
  # Annotations (cloud provider specific)
  annotations: {}
    # AWS Load Balancer Controller
    # service.beta.kubernetes.io/aws-load-balancer-type: external
    # service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    # service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    
    # GCP Load Balancer
    # cloud.google.com/neg: '{"ingress": true}'
    # cloud.google.com/backend-config: '{"default": "governance-kernel-backendconfig"}'
    
    # Azure Load Balancer
    # service.beta.kubernetes.io/azure-load-balancer-internal: "true"

# ============================================================================
# Ingress Configuration
# ============================================================================

ingress:
  enabled: false  # Enable for external access
  
  className: "nginx"
  
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    
    # Security headers
    nginx.ingress.kubernetes.io/server-snippet: |
      add_header X-Frame-Options DENY;
      add_header X-Content-Type-Options nosniff;
      add_header X-XSS-Protection "1; mode=block";
  
  hosts:
    - host: governance-kernel.mahoun.ai
      paths:
        - path: /
          pathType: Prefix
          service:
            name: governance-kernel
            port: 8080
  
  tls:
    - secretName: governance-kernel-tls
      hosts:
        - governance-kernel.mahoun.ai

# ============================================================================
# Resource Management
# ============================================================================

resources:
  # Resource requests (guaranteed)
  requests:
    memory: "64Mi"
    cpu: "100m"
    ephemeral-storage: "64Mi"
  
  # Resource limits (maximum)
  limits:
    memory: "256Mi"
    cpu: "500m"
    ephemeral-storage: "128Mi"

# Vertical Pod Autoscaler (if available)
vpa:
  enabled: false
  updateMode: "Off"  # Options: Off, Initial, Auto

# ============================================================================
# Horizontal Pod Autoscaling
# ============================================================================

autoscaling:
  enabled: true
  
  minReplicas: 3
  maxReplicas: 20
  
  # CPU-based scaling
  targetCPUUtilizationPercentage: 70
  
  # Memory-based scaling  
  targetMemoryUtilizationPercentage: 80
  
  # Custom metrics
  customMetrics:
    - type: Pods
      pods:
        metric:
          name: governance_requests_per_second
        target:
          type: AverageValue
          averageValue: "50"
  
  # Scaling behavior
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

# ============================================================================
# Pod Disruption Budget
# ============================================================================

podDisruptionBudget:
  enabled: true
  minAvailable: 2  # or percentage: "66%"

# ============================================================================
# Configuration
# ============================================================================

config:
  # Server configuration
  server:
    port: 8080
    metricsPort: 9090
    workerThreads: 4
    maxConnections: 1000
    requestTimeout: 30
  
  # Governance settings
  governance:
    mode: "STRICT"  # STRICT, AUDIT, DISABLED
    logLevel: "INFO"
    auditEnabled: true
    
    # Advanced settings
    advanced:
      enableForensics: true
      enableMetrics: true
      enableTracing: true
      cacheTTL: 300
      maxCacheSize: 1000
  
  # Python runtime
  python:
    unbuffered: true
    dontWriteBytecode: true
    optimizeLevel: 1

# ============================================================================
# Secrets Management
# ============================================================================

secrets:
  # External secret management
  external:
    enabled: false
    provider: "vault"  # vault, aws-secrets-manager, azure-keyvault, gcp-secret-manager
    
    # HashiCorp Vault
    vault:
      address: "https://vault.mahoun.ai"
      path: "secret/governance-kernel"
      role: "governance-kernel"
    
    # AWS Secrets Manager
    aws:
      region: us-west-2
      secretName: "mahoun/governance-kernel"
    
    # Azure Key Vault
    azure:
      vaultName: "mahoun-governance-kv"
      tenantId: "00000000-0000-0000-0000-000000000000"
    
    # GCP Secret Manager
    gcp:
      projectId: "mahoun-production"
      secretId: "governance-kernel-config"
  
  # Inline secrets (for development only)
  inline:
    governanceApiKey: ""  # Will be base64 encoded
    metricsAuthToken: ""
    tlsCertPassword: ""

# ============================================================================
# Health Checks
# ============================================================================

healthChecks:
  # Liveness probe
  livenessProbe:
    httpGet:
      path: /health
      port: governance
      scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  
  # Readiness probe
  readinessProbe:
    httpGet:
      path: /health
      port: governance
      scheme: HTTP
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    successThreshold: 1
    failureThreshold: 3
  
  # Startup probe
  startupProbe:
    httpGet:
      path: /health
      port: governance
      scheme: HTTP
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 2
    successThreshold: 1
    failureThreshold: 10

# ============================================================================
# Security
# ============================================================================

security:
  # Pod Security Standards
  podSecurityStandards:
    enforce: "restricted"
    audit: "restricted"
    warn: "restricted"
  
  # Security Context
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1001
    capabilities:
      drop:
        - ALL
  
  # Network Policies
  networkPolicy:
    enabled: true
    
    # Ingress rules
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                name: mahoun-governance
        ports:
          - protocol: TCP
            port: 8080
      
      - from:
          - namespaceSelector:
              matchLabels:
                name: monitoring
        ports:
          - protocol: TCP
            port: 9090
    
    # Egress rules
    egress:
      - to: []
        ports:
          - protocol: UDP
            port: 53  # DNS
      
      - to:
          - namespaceSelector:
              matchLabels:
                name: kube-system
        ports:
          - protocol: TCP
            port: 443  # Kubernetes API
  
  # Service Mesh (Istio)
  serviceMesh:
    enabled: false
    
    istio:
      # Strict mTLS
      peerAuthentication:
        mode: STRICT
      
      # Authorization policies
      authorizationPolicies:
        - name: allow-monitoring
          rules:
            - from:
                - source:
                    namespaces: ["monitoring"]
            - to:
                - operation:
                    ports: ["9090"]

# ============================================================================
# Monitoring & Observability
# ============================================================================

monitoring:
  # Prometheus metrics
  prometheus:
    enabled: true
    port: 9090
    path: /metrics
    
    # ServiceMonitor for Prometheus Operator
    serviceMonitor:
      enabled: true
      namespace: monitoring
      labels:
        release: prometheus
      interval: 30s
      scrapeTimeout: 10s
  
  # Grafana dashboards
  grafana:
    enabled: true
    dashboards:
      - name: governance-kernel-overview
        configMap: governance-kernel-dashboard
  
  # Distributed tracing
  tracing:
    enabled: false
    provider: "jaeger"  # jaeger, zipkin, otel
    
    jaeger:
      agent: "jaeger-agent.tracing.svc.cluster.local:6831"
    
    opentelemetry:
      collector: "otel-collector.tracing.svc.cluster.local:4317"

# ============================================================================
# Backup & Recovery
# ============================================================================

backup:
  enabled: false
  
  # Configuration backup
  config:
    schedule: "0 2 * * *"  # Daily at 2 AM
    retention: "30d"
  
  # State backup (if stateful)
  state:
    enabled: false
    schedule: "0 */6 * * *"  # Every 6 hours
    retention: "7d"

# ============================================================================
# Testing & Validation
# ============================================================================

testing:
  # Smoke tests
  smokeTests:
    enabled: true
    image: "curlimages/curl:7.88.1"
    
    tests:
      - name: health-check
        command: ["curl", "-f", "http://governance-kernel:8080/health"]
      
      - name: metrics-check
        command: ["curl", "-f", "http://governance-kernel:9090/metrics"]
  
  # Load testing
  loadTests:
    enabled: false
    image: "grafana/k6:0.44.1"
    
    scenarios:
      - name: baseline
        vus: 10
        duration: "5m"
      
      - name: stress
        vus: 100
        duration: "10m"

# ============================================================================
# Environment Overrides
# ============================================================================

# Development environment
development:
  replicaCount: 1
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  autoscaling:
    enabled: false
  monitoring:
    enabled: false

# Staging environment
staging:
  replicaCount: 2
  resources:
    requests:
      memory: "48Mi"
      cpu: "75m"
    limits:
      memory: "192Mi"
      cpu: "300m"
  autoscaling:
    minReplicas: 2
    maxReplicas: 10

# Production environment
production:
  replicaCount: 3
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  autoscaling:
    minReplicas: 3
    maxReplicas: 20
  monitoring:
    enabled: true
  security:
    networkPolicy:
      enabled: true

# ============================================================================
# Advanced Configuration
# ============================================================================

# Chaos Engineering
chaosEngineering:
  enabled: false
  
  # Chaos Mesh experiments
  chaosMesh:
    experiments:
      - name: pod-kill
        schedule: "0 */6 * * *"  # Every 6 hours
        duration: "2m"
      
      - name: network-delay
        schedule: "0 */12 * * *"  # Every 12 hours
        duration: "5m"
        delay: "100ms"

# Feature flags
featureFlags:
  # Experimental features
  experimental:
    enableAdvancedMetrics: false
    enableDistributedTracing: false
    enableChaosEngineering: false
  
  # Beta features
  beta:
    enableServiceMesh: false
    enableAdvancedSecurity: true
    enableAutoScaling: true

# Migration settings
migration:
  # Blue-green deployment
  blueGreen:
    enabled: false
    
  # Canary deployment
  canary:
    enabled: false
    steps:
      - weight: 10
        pause: 300  # 5 minutes
      - weight: 25
        pause: 600  # 10 minutes
      - weight: 50
        pause: 900  # 15 minutes
      - weight: 100