openapi: 3.0.3
info:
  title: MAHOUN Governance Kernel API
  description: |
    **G-0 CONTRACT FREEZE v1.0**
    
    Immutable API contract for MAHOUN Governance Kernel microservice.
    This contract is FROZEN and cannot be modified without breaking compatibility.
    
    **Security:** All endpoints require governance context validation.
    **Audit:** All operations generate immutable audit events.
    **Determinism:** All responses must be deterministic for given inputs.
    
  version: 1.0.0
  contact:
    name: MAHOUN Platform Team
    email: governance@mahoun.platform
  license:
    name: Proprietary
    url: https://mahoun.platform/license

servers:
  - url: http://governance-kernel:8080
    description: Internal governance kernel service
  - url: https://governance.mahoun.internal
    description: Production governance endpoint

security:
  - GovernanceApiKey: []
  - GovernanceContext: []

paths:
  # ============================================================================
  # CORE GOVERNANCE OPERATIONS (IMMUTABLE)
  # ============================================================================
  
  /v1/governance/enforce:
    post:
      summary: Enforce governance rules
      description: |
        **CRITICAL ENDPOINT** - Validates and enforces governance rules.
        
        **Contract Guarantees:**
        - Deterministic responses for identical inputs
        - Immutable audit trail generation  
        - Policy enforcement cannot be bypassed
        - Response time < 100ms (P95)
        
        **Error Codes:**
        - 403: Governance violation (specific violation_code)
        - 422: Invalid request format
        - 500: Internal governance error
        - 503: Governance lock unavailable
        
      operationId: enforceGovernance
      tags:
        - Governance Core
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernanceEnforceRequest'
            examples:
              reasoning_query:
                summary: Reasoning query validation
                value:
                  query_type: "REASONING_QUERY"
                  correlation_id: "req-123e4567-e89b-12d3-a456-426614174000"
                  actor_id: "reasoning-engine-v1"
                  resource_id: "legal-doc-456"
                  allow_destructive: false
                  metadata:
                    query_complexity: "HIGH"
                    data_sensitivity: "CONFIDENTIAL"
      responses:
        '200':
          description: Governance validation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceEnforceResponse'
              examples:
                allowed:
                  summary: Request allowed
                  value:
                    status: "ALLOWED"
                    correlation_id: "req-123e4567-e89b-12d3-a456-426614174000"
                    governance_id: "gov-789f0123-e45f-67g8-h901-234567890123"
                    policy_version: "2026.06.17.001"
                    audit_event_id: "audit-345g6789-f01g-23h4-i567-890123456789"
                    constraints: []
                    metadata:
                      enforcement_time_ms: 23
                      policy_checks: 7
        '403':
          description: Governance violation - request denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceViolationResponse'
              examples:
                denied:
                  summary: Request denied due to policy violation
                  value:
                    status: "DENIED" 
                    correlation_id: "req-123e4567-e89b-12d3-a456-426614174000"
                    governance_id: "gov-789f0123-e45f-67g8-h901-234567890123"
                    violation_code: "DESTRUCTIVE_OPERATION_FORBIDDEN"
                    violation_category: "SECURITY"
                    violation_severity: "HIGH"
                    reason: "Destructive operation attempted without explicit authorization"
                    audit_event_id: "audit-345g6789-f01g-23h4-i567-890123456789"
                    required_permissions: ["DESTRUCTIVE_OPERATIONS", "ADMIN_OVERRIDE"]
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/governance/validate:
    post:
      summary: Validate reasoning response
      description: |
        **FORTRESS VALIDATOR ENDPOINT** - Validates reasoning responses using FortressValidator.
        
        **Contract Guarantees:**
        - FortressValidator 6-check validation
        - Symbolic/neural agreement ≥ 85%
        - Proof tree requirement enforcement
        - Immutable validation results
        
      operationId: validateReasoning
      tags:
        - Governance Core
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernanceValidateRequest'
      responses:
        '200':
          description: Validation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceValidateResponse'
        '403':
          $ref: '#/components/responses/ValidationFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/governance/context:
    post:
      summary: Create governance context
      description: |
        **CONTEXT MANAGEMENT** - Creates governance context for request tracing.
        
        **Contract Guarantees:**
        - Unique correlation ID generation
        - Context inheritance patterns
        - Audit trail linkage
        - Context isolation enforcement
        
      operationId: createGovernanceContext
      tags:
        - Governance Context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernanceContextRequest'
      responses:
        '201':
          description: Context created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceContextResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # POLICY OPERATIONS (IMMUTABLE)
  # ============================================================================

  /v1/policy/check:
    post:
      summary: Check policy compliance
      description: |
        **POLICY ENGINE** - Validates requests against governance policies.
        
        **Contract Guarantees:**
        - Policy version consistency
        - Deterministic policy evaluation
        - Policy violation categorization
        - Compliance scoring (0-100)
        
      operationId: checkPolicy
      tags:
        - Policy Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyCheckRequest'
      responses:
        '200':
          description: Policy check completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyCheckResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # SYSTEM STATUS & MONITORING (STABLE)
  # ============================================================================

  /health:
    get:
      summary: Health check endpoint  
      description: |
        **HEALTH MONITORING** - Provides governance kernel health status.
        
        **Contract Guarantees:**
        - Response time < 50ms
        - Governance lock status included
        - Dependency health validation
        - Readiness/liveness indicators
        
      operationId: healthCheck
      tags:
        - System
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "healthy"
                service: "governance-kernel"
                version: "1.0.0"
                governance_mode: "STRICT"
                governance_enabled: true
                governance_lock_hash: "1a2b3c4d5e6f7890"
                uptime_seconds: 3600
                dependencies:
                  governance_lock: "healthy"
                  audit_writer: "healthy"
                  policy_engine: "healthy"
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "unhealthy"
                service: "governance-kernel"
                error: "Governance lock initialization failed"
                dependencies:
                  governance_lock: "failed"

  /version:
    get:
      summary: Get service version information
      description: |
        **VERSION ENDPOINT** - Returns detailed version and build information.
        
        **Contract Guarantees:**
        - Semantic versioning compliance
        - Build metadata inclusion
        - API contract version mapping
        - Deployment environment info
        
      operationId: getVersion
      tags:
        - System
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'

  /metrics:
    get:
      summary: Prometheus metrics endpoint
      description: |
        **METRICS COLLECTION** - Provides governance kernel metrics in Prometheus format.
        
        **Contract Guarantees:**
        - Standard Prometheus format
        - Governance-specific metrics
        - Performance counters
        - Error rate tracking
        
      operationId: getMetrics
      tags:
        - Monitoring
      responses:
        '200':
          description: Metrics in Prometheus format
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP governance_requests_total Total governance requests
                  # TYPE governance_requests_total counter
                  governance_requests_total{operation="enforce",result="allowed"} 1523
                  governance_requests_total{operation="enforce",result="denied"} 87
                  
                  # HELP governance_response_time_seconds Response time distribution
                  # TYPE governance_response_time_seconds histogram
                  governance_response_time_seconds_bucket{operation="enforce",le="0.01"} 1234
                  governance_response_time_seconds_bucket{operation="enforce",le="0.05"} 1456
                  governance_response_time_seconds_bucket{operation="enforce",le="0.1"} 1523
                  governance_response_time_seconds_bucket{operation="enforce",le="+Inf"} 1610

# ============================================================================
# DATA MODELS (CONTRACT FROZEN)
# ============================================================================

components:
  securitySchemes:
    GovernanceApiKey:
      type: apiKey
      in: header
      name: X-Governance-API-Key
      description: Governance service API key
    
    GovernanceContext:
      type: apiKey
      in: header  
      name: X-Governance-Context
      description: Base64-encoded governance context

  schemas:
    # ========================================================================
    # CORE REQUEST/RESPONSE SCHEMAS
    # ========================================================================
    
    GovernanceEnforceRequest:
      type: object
      required:
        - query_type
        - correlation_id
        - actor_id
      properties:
        query_type:
          type: string
          enum:
            - REASONING_QUERY
            - DOCUMENT_ANALYSIS
            - GRAPH_TRAVERSAL
            - VERDICT_GENERATION
            - POLICY_EVALUATION
            - AUDIT_LOG_ACCESS
            - DESTRUCTIVE_OPERATION
            - SYSTEM_CONFIGURATION
          description: Type of operation requesting governance validation
        correlation_id:
          type: string
          format: uuid
          description: Unique request identifier for audit tracing
        actor_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^[a-zA-Z0-9_-]+$'
          description: Identifier of the requesting actor/service
        resource_id:
          type: string
          maxLength: 512
          description: Optional resource being accessed
        allow_destructive:
          type: boolean
          default: false
          description: Whether destructive operations are explicitly allowed
        metadata:
          type: object
          additionalProperties: true
          description: Additional context metadata for governance decisions
      example:
        query_type: "REASONING_QUERY"
        correlation_id: "123e4567-e89b-12d3-a456-426614174000"
        actor_id: "reasoning-engine-v1"
        resource_id: "legal-document-456"
        allow_destructive: false
        metadata:
          query_complexity: "HIGH"
          data_sensitivity: "CONFIDENTIAL"

    GovernanceEnforceResponse:
      type: object
      required:
        - status
        - correlation_id
        - governance_id
        - policy_version
        - audit_event_id
      properties:
        status:
          type: string
          enum: [ALLOWED, DENIED]
          description: Governance decision result
        correlation_id:
          type: string
          format: uuid
          description: Original request correlation ID
        governance_id:
          type: string
          format: uuid
          description: Unique governance decision identifier
        policy_version:
          type: string
          pattern: '^\d{4}\.\d{2}\.\d{2}\.\d{3}$'
          description: Policy version used for decision (YYYY.MM.DD.NNN format)
        audit_event_id:
          type: string
          format: uuid
          description: Audit event identifier for immutable logging
        constraints:
          type: array
          items:
            $ref: '#/components/schemas/GovernanceConstraint'
          description: Optional constraints applied to allowed operations
        metadata:
          type: object
          properties:
            enforcement_time_ms:
              type: integer
              minimum: 0
              description: Time taken for governance enforcement (milliseconds)
            policy_checks:
              type: integer
              minimum: 0
              description: Number of policy checks performed
            cache_hit:
              type: boolean
              description: Whether result was served from cache
          additionalProperties: true
          
    GovernanceViolationResponse:
      type: object
      required:
        - status
        - correlation_id
        - governance_id
        - violation_code
        - violation_category
        - violation_severity
        - reason
        - audit_event_id
      properties:
        status:
          type: string
          enum: [DENIED]
        correlation_id:
          type: string
          format: uuid
        governance_id:
          type: string
          format: uuid
        violation_code:
          type: string
          enum:
            - DESTRUCTIVE_OPERATION_FORBIDDEN
            - INSUFFICIENT_PERMISSIONS
            - POLICY_VIOLATION
            - RESOURCE_ACCESS_DENIED
            - RATE_LIMIT_EXCEEDED
            - INVALID_ACTOR
            - CONTEXT_VIOLATION
            - AUDIT_REQUIREMENT_FAILED
          description: Specific violation type code
        violation_category:
          type: string
          enum: [SECURITY, COMPLIANCE, PERFORMANCE, AUDIT]
          description: High-level violation category
        violation_severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
          description: Severity level of the violation
        reason:
          type: string
          maxLength: 1024
          description: Human-readable violation explanation
        audit_event_id:
          type: string
          format: uuid
        required_permissions:
          type: array
          items:
            type: string
          description: Permissions required to satisfy this request

    GovernanceValidateRequest:
      type: object
      required:
        - correlation_id
        - reasoning_response
        - validation_mode
      properties:
        correlation_id:
          type: string
          format: uuid
        reasoning_response:
          $ref: '#/components/schemas/ReasoningResponse'
        validation_mode:
          type: string
          enum: [FORTRESS, STANDARD, AUDIT_ONLY]
          description: Validation mode to apply
        fortress_config:
          $ref: '#/components/schemas/FortressConfig'

    GovernanceValidateResponse:
      type: object
      required:
        - status
        - correlation_id
        - validation_id
        - fortress_checks
        - audit_event_id
      properties:
        status:
          type: string
          enum: [VALIDATED, REJECTED, WARNING]
        correlation_id:
          type: string
          format: uuid
        validation_id:
          type: string
          format: uuid
        fortress_checks:
          $ref: '#/components/schemas/FortressValidationResult'
        audit_event_id:
          type: string
          format: uuid
        warnings:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true

    # ========================================================================
    # SUPPORTING SCHEMAS
    # ========================================================================

    GovernanceConstraint:
      type: object
      required:
        - constraint_type
        - constraint_value
      properties:
        constraint_type:
          type: string
          enum:
            - RATE_LIMIT
            - TIME_WINDOW
            - RESOURCE_QUOTA
            - APPROVAL_REQUIRED
            - AUDIT_ENHANCED
        constraint_value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
        constraint_metadata:
          type: object
          additionalProperties: true

    ReasoningResponse:
      type: object
      required:
        - verdict
        - confidence_score
        - evidence_chain
      properties:
        verdict:
          type: string
          maxLength: 4096
        confidence_score:
          type: number
          minimum: 0.0
          maximum: 1.0
        evidence_chain:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        proof_tree:
          $ref: '#/components/schemas/ProofTree'
        symbolic_reasoning:
          $ref: '#/components/schemas/SymbolicReasoning'

    Evidence:
      type: object
      required:
        - evidence_id
        - evidence_type
        - content
      properties:
        evidence_id:
          type: string
          format: uuid
        evidence_type:
          type: string
          enum: [DOCUMENT, CASE_LAW, STATUTE, PRECEDENT, EXPERT_OPINION]
        content:
          type: string
        source_reference:
          type: string
        reliability_score:
          type: number
          minimum: 0.0
          maximum: 1.0

    ProofTree:
      type: object
      required:
        - root_node
        - nodes
      properties:
        root_node:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ProofNode'

    ProofNode:
      type: object
      required:
        - node_id
        - node_type
        - content
      properties:
        node_id:
          type: string
        node_type:
          type: string
          enum: [PREMISE, INFERENCE, CONCLUSION]
        content:
          type: string
        children:
          type: array
          items:
            type: string
        evidence_refs:
          type: array
          items:
            type: string

    SymbolicReasoning:
      type: object
      properties:
        logical_steps:
          type: array
          items:
            type: string
        formal_proof:
          type: string
        axioms_used:
          type: array
          items:
            type: string

    FortressConfig:
      type: object
      properties:
        min_agreement_score:
          type: number
          minimum: 0.0
          maximum: 1.0
          default: 0.85
        min_confidence_score:
          type: number
          minimum: 0.0
          maximum: 1.0
          default: 0.70
        require_proof_tree:
          type: boolean
          default: true
        enable_contradiction_detection:
          type: boolean
          default: true

    FortressValidationResult:
      type: object
      required:
        - overall_pass
        - agreement_score
        - confidence_score
        - checks_performed
      properties:
        overall_pass:
          type: boolean
        agreement_score:
          type: number
          minimum: 0.0
          maximum: 1.0
        confidence_score:
          type: number
          minimum: 0.0
          maximum: 1.0
        proof_tree_valid:
          type: boolean
        contradiction_detected:
          type: boolean
        checks_performed:
          type: array
          items:
            $ref: '#/components/schemas/FortressCheck'

    FortressCheck:
      type: object
      required:
        - check_name
        - check_result
      properties:
        check_name:
          type: string
          enum:
            - SYMBOLIC_NEURAL_AGREEMENT
            - CONFIDENCE_THRESHOLD  
            - PROOF_TREE_VALIDITY
            - CONTRADICTION_DETECTION
            - EVIDENCE_CONSISTENCY
            - LOGICAL_COHERENCE
        check_result:
          type: string
          enum: [PASS, FAIL, WARNING, SKIP]
        check_score:
          type: number
          minimum: 0.0
          maximum: 1.0
        check_details:
          type: string

    # ========================================================================
    # CONTEXT & POLICY SCHEMAS
    # ========================================================================

    GovernanceContextRequest:
      type: object
      required:
        - correlation_id
        - actor_id
      properties:
        correlation_id:
          type: string
          format: uuid
        actor_id:
          type: string
        scope_id:
          type: string
        query_type:
          type: string
        origin:
          type: string
          description: Origin service or component
        parent_context_id:
          type: string
          format: uuid
          description: Parent context for nested operations

    GovernanceContextResponse:
      type: object
      required:
        - status
        - context_id
        - correlation_id
        - actor_id
      properties:
        status:
          type: string
          enum: [CREATED, REUSED]
        context_id:
          type: string
          format: uuid
        correlation_id:
          type: string
          format: uuid
        actor_id:
          type: string
        expires_at:
          type: string
          format: date-time
        context_metadata:
          type: object
          additionalProperties: true

    PolicyCheckRequest:
      type: object
      required:
        - policy_domain
        - request_context
      properties:
        policy_domain:
          type: string
          enum:
            - DATA_ACCESS
            - DESTRUCTIVE_OPERATIONS
            - REASONING_QUERIES
            - AUDIT_REQUIREMENTS
            - PERFORMANCE_LIMITS
        request_context:
          $ref: '#/components/schemas/RequestContext'
        policy_version:
          type: string
          description: Optional specific policy version

    PolicyCheckResponse:
      type: object
      required:
        - compliance_status
        - policy_version
        - compliance_score
      properties:
        compliance_status:
          type: string
          enum: [COMPLIANT, NON_COMPLIANT, CONDITIONAL]
        policy_version:
          type: string
        compliance_score:
          type: number
          minimum: 0
          maximum: 100
        violations:
          type: array
          items:
            $ref: '#/components/schemas/PolicyViolation'
        recommendations:
          type: array
          items:
            type: string

    RequestContext:
      type: object
      properties:
        actor_id:
          type: string
        resource_type:
          type: string
        operation_type:
          type: string
        data_classification:
          type: string
          enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]
        request_metadata:
          type: object
          additionalProperties: true

    PolicyViolation:
      type: object
      required:
        - violation_type
        - severity
        - description
      properties:
        violation_type:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        description:
          type: string
        remediation:
          type: string

    # ========================================================================
    # SYSTEM SCHEMAS
    # ========================================================================

    HealthResponse:
      type: object
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, degraded]
        service:
          type: string
          example: "governance-kernel"
        version:
          type: string
          pattern: '^\d+\.\d+\.\d+$'
        governance_mode:
          type: string
          enum: [STRICT, WARN, AUDIT, OFF]
        governance_enabled:
          type: boolean
        governance_lock_hash:
          type: string
          pattern: '^[a-f0-9]{16}$'
        uptime_seconds:
          type: integer
          minimum: 0
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [healthy, unhealthy, unknown]
        error:
          type: string
          description: Error message if status is unhealthy

    VersionResponse:
      type: object
      required:
        - service
        - version
        - api_version
        - build_info
      properties:
        service:
          type: string
        version:
          type: string
          pattern: '^\d+\.\d+\.\d+$'
        api_version:
          type: string
          pattern: '^v\d+$'
        build_info:
          type: object
          required:
            - build_time
            - git_commit
            - build_environment
          properties:
            build_time:
              type: string
              format: date-time
            git_commit:
              type: string
              pattern: '^[a-f0-9]{40}$'
            git_branch:
              type: string
            build_environment:
              type: string
              enum: [development, staging, production]

  # ==========================================================================
  # STANDARD ERROR RESPONSES
  # ==========================================================================
  
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - message
              - correlation_id
            properties:
              error:
                type: string
                example: "VALIDATION_ERROR"
              message:
                type: string
                example: "Invalid request format"
              correlation_id:
                type: string
                format: uuid
              field_errors:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    error:
                      type: string

    ValidationFailed:
      description: Governance validation failed
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - correlation_id
              - validation_id
              - failure_reason
            properties:
              status:
                type: string
                enum: [REJECTED]
              correlation_id:
                type: string
                format: uuid
              validation_id:
                type: string
                format: uuid
              failure_reason:
                type: string
              fortress_failures:
                type: array
                items:
                  $ref: '#/components/schemas/FortressCheck'

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - message
              - correlation_id
            properties:
              error:
                type: string
                example: "INTERNAL_ERROR"
              message:
                type: string
                example: "Governance kernel internal error"
              correlation_id:
                type: string
                format: uuid
              error_id:
                type: string
